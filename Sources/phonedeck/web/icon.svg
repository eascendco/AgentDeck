<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- AgentDeck app icon: a phone on its side showing the AI page (a sparkle key and three agents with
       status dots), on the macOS icon grid (824 px squircle in a 1024 canvas, soft shadow). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2F6B"/><stop offset="1" stop-color="#0D0F2B"/></linearGradient>
    <radialGradient id="glow" cx=".3" cy=".15" r=".8"><stop offset="0" stop-color="#7C83FF" stop-opacity=".45"/><stop offset="1" stop-color="#7C83FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB37A"/><stop offset="1" stop-color="#FF6A3D"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F6FF"/><stop offset="1" stop-color="#C9CFEA"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <g transform="translate(100 100) scale(0.8046875)">
    <g filter="url(#sh)">
      <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
    </g>
    <rect width="1024" height="1024" rx="228" fill="url(#glow)"/>
    <rect x="132" y="262" width="760" height="470" rx="92" fill="url(#phone)"/>
    <rect x="166" y="296" width="692" height="402" rx="64" fill="#10122E"/>
    <rect x="206" y="336" width="322" height="322" rx="70" fill="url(#spark)"/>
    <path d="M367 392 C380 470 396 486 474 497 C396 508 380 524 367 602 C354 524 338 508 260 497 C338 486 354 470 367 392 Z" fill="#fff"/>
    <circle cx="592" cy="392" r="26" fill="#30D158"/><rect x="638" y="376" width="180" height="32" rx="16" fill="#3A3F78"/>
    <circle cx="592" cy="497" r="26" fill="#3C9DFF"/><rect x="638" y="481" width="140" height="32" rx="16" fill="#3A3F78"/>
    <circle cx="592" cy="602" r="26" fill="#FF9F0A"/><rect x="638" y="586" width="160" height="32" rx="16" fill="#3A3F78"/>
  </g>
</svg>
